<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>1　数字・時間</title>
  <style>
    :root {
      --bg: #090909;
      --card: #161616;
      --card-on: #1f2a22;
      --line: #2a2a2a;
      --text: #ececec;
      --dim: #8a8a8a;
      --kana: #f4f4f4;
      --accent: #7dcea0;
      --bad: #e57373;
      --ok: #7dcea0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: "Hiragino Sans", "PingFang SC", "Noto Sans JP", sans-serif;
      min-height: 100%;
    }
    body { padding: 12px 12px calc(88px + env(safe-area-inset-bottom)); }
    header { margin-bottom: 10px; }
    h1 { font-size: 18px; font-weight: 650; letter-spacing: .2em; }
    h2 { font-size: 15px; font-weight: 650; margin-bottom: 6px; }
    .sub { color: var(--dim); font-size: 12px; margin-top: 4px; }
    .bar {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
      margin: 10px 0 12px;
    }
    input[type="search"] {
      flex: 1 1 160px; min-width: 140px;
      background: var(--card); color: var(--text);
      border: 1px solid var(--line); border-radius: 8px;
      padding: 8px 10px; font-size: 15px;
    }
    button, select {
      background: var(--card); color: var(--text);
      border: 1px solid var(--line); border-radius: 8px;
      padding: 8px 10px; font-size: 13px; cursor: pointer;
    }
    button:hover, button.on { border-color: var(--accent); color: var(--accent); }
    button:disabled { opacity: .45; cursor: default; }
    .rate { color: var(--dim); font-size: 12px; display: flex; align-items: center; gap: 6px; }
    input[type="range"] { width: 90px; accent-color: var(--accent); }
    .quiz {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 14px 12px;
      margin-bottom: 14px;
    }
    .quiz-head {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 10px; flex-wrap: wrap; margin-bottom: 10px;
    }
    .quiz-meta { color: var(--dim); font-size: 12px; margin-top: 4px; }
    .quiz-modes { display: flex; gap: 6px; flex-wrap: wrap; }
    .quiz-prompt {
      text-align: center;
      padding: 14px 8px 10px;
      border: 1px dashed var(--line);
      border-radius: 10px;
      margin-bottom: 10px;
      min-height: 72px;
      display: grid;
      place-items: center;
    }
    .quiz-kana { font-size: 34px; font-weight: 700; letter-spacing: .06em; }
    .quiz-subkana { font-size: 14px; color: var(--dim); margin-top: 4px; }
    .quiz-audio { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
    .quiz-audio .big { font-size: 28px; }
    .quiz-options {
      display: grid;
      gap: 8px;
    }
    .quiz-options button {
      text-align: left;
      padding: 10px 12px;
      font-size: 14px;
      line-height: 1.4;
    }
    .quiz-options button.correct { border-color: var(--ok); color: var(--ok); }
    .quiz-options button.wrong { border-color: var(--bad); color: var(--bad); }
    .quiz-foot {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
      margin-top: 10px;
    }
    .quiz-result { font-size: 13px; color: var(--dim); flex: 1; }
    .list { display: flex; flex-direction: column; gap: 12px; }
    .cat {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 8px 10px;
      background: #101010;
    }
    .cat-h {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 8px; margin: 0 2px 8px; font-size: 13px; font-weight: 650;
    }
    .cat-h small { color: var(--dim); font-weight: 500; font-size: 11px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
      gap: 5px;
    }
    .cell {
      position: relative;
      border: 1px solid var(--c-line, var(--line));
      background: var(--c-bg, var(--card));
      color: var(--text);
      border-radius: 8px;
      padding: 7px 6px 6px;
      min-height: 68px;
      cursor: pointer;
      text-align: center;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1px;
      user-select: none;
    }
    .cell:hover { filter: brightness(1.08); }
    .cell.learned { box-shadow: inset 0 0 0 1px var(--accent); }
    .cell.playing { outline: 2px solid var(--accent); outline-offset: 0; }
    .cell .kanji {
      font-size: 18px; font-weight: 750; line-height: 1.15;
      letter-spacing: .02em; word-break: break-all;
    }
    .cell .kana {
      font-size: 11px; font-weight: 600; line-height: 1.15;
      letter-spacing: .02em; word-break: break-all; color: #cfcfcf;
    }
    .cell .mean { font-size: 11px; color: #d0d0d0; line-height: 1.2; }
    .cell .roma {
      font-size: 9px; color: var(--c-roma, var(--accent));
      font-family: ui-monospace, Menlo, monospace; opacity: .9;
      line-height: 1.15; word-break: break-all;
    }

    .cell .mark {
      position: absolute; top: 3px; right: 4px;
      width: 14px; height: 14px; border-radius: 4px;
      border: 1px solid var(--c-line, var(--line));
      background: rgba(0,0,0,.25);
      font-size: 10px; line-height: 12px; color: transparent;
      padding: 0;
    }
    .cell.learned .mark {
      background: var(--accent); border-color: var(--accent); color: #062016;
    }
    .cat-数字 { --c-bg:#13201c; --c-line:#2d5a48; --c-roma:#8fd6b5; --c-title:#8fd6b5; }
    .cat-钱 { --c-bg:#221a10; --c-line:#6a5230; --c-roma:#e2c07a; --c-title:#e2c07a; }
    .cat-电话 { --c-bg:#122028; --c-line:#35586a; --c-roma:#8ec8df; --c-title:#8ec8df; }
    .cat-门牌 { --c-bg:#1a2014; --c-line:#4a5c36; --c-roma:#b5c98a; --c-title:#b5c98a; }
    .cat-日期 { --c-bg:#141c28; --c-line:#3a5578; --c-roma:#8fb3e0; --c-title:#8fb3e0; }
    .cat-星期 { --c-bg:#1c1626; --c-line:#5a4578; --c-roma:#c2a6e8; --c-title:#c2a6e8; }
    .cat-月 { --c-bg:#161824; --c-line:#454a78; --c-roma:#a8ade6; --c-title:#a8ade6; }
    .cat-四季 { --c-bg:#241816; --c-line:#784a40; --c-roma:#e6a898; --c-title:#e6a898; }
    .cat-年 { --c-bg:#181c22; --c-line:#4a5868; --c-roma:#a8b8c8; --c-title:#a8b8c8; }
    .cat-时 { --c-bg:#10221f; --c-line:#2f6658; --c-roma:#7fd4bf; --c-title:#7fd4bf; }
    .cat-分 { --c-bg:#10221a; --c-line:#2f6650; --c-roma:#7fd4a8; --c-title:#7fd4a8; }
    .cat-秒 { --c-bg:#102218; --c-line:#2f6648; --c-roma:#8fd49a; --c-title:#8fd49a; }
    .cat-计数 { --c-bg:#1a1524; --c-line:#5a4878; --c-roma:#c4b0e8; --c-title:#c4b0e8; }
    .cat-计量 { --c-bg:#152024; --c-line:#3a6878; --c-roma:#9fd0e0; --c-title:#9fd0e0; }
    .cat-日常 { --c-bg:#221810; --c-line:#6a4e36; --c-roma:#e0b892; --c-title:#e0b892; }
    .cat-其他 { --c-bg:#161616; --c-line:#2a2a2a; --c-roma:#7dcea0; --c-title:#ececec; }
    .cat-h { color: var(--c-title, var(--text)); }
    .dock {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: #111; border-top: 1px solid var(--line);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
    }
    .hint { color: var(--dim); font-size: 11px; text-align: center; margin-top: 6px; }
    .empty { color: var(--dim); padding: 20px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <a href="../" style="color:#8a8a8a;font-size:12px">← 日语速查</a>
    <div style="display:flex;gap:10px;margin:8px 0 10px;font-size:13px">
      <a href="../0/" style="color:#ececec">0 速查</a>
      <a href="../1/" style="color:#7dcea0">1 数字</a>
      <a href="../2/" style="color:#ececec">2 片假名</a>
      <a href="../3/" style="color:#ececec">3 真题</a>
      <a href="../4/" style="color:#ececec">4 面试</a>
    </div>
    <h1>1　数字・時間</h1>
    <div class="sub">汉字 + 读音。含计数（一つ/一人/一回…）、计量（m/kg/℃…）、四点半、完整电话例。点格跟读，右上角 ✓ 测验。</div>
  </header>

  <section class="quiz" id="quiz">
    <div class="quiz-head">
      <div>
        <h2>随机测验</h2>
        <div class="quiz-meta" id="quiz-meta">先点下面格子右上角 ✓ 标记学会，再开始</div>
      </div>
      <div class="quiz-modes">
        <button id="mode-text" type="button" class="on">看日文</button>
        <button id="mode-audio" type="button">听音</button>
      </div>
    </div>
    <div class="quiz-prompt" id="quiz-prompt">
      <div class="quiz-meta">勾选词表后点「下一题」</div>
    </div>
    <div class="quiz-options" id="quiz-options"></div>
    <div class="quiz-foot">
      <div class="quiz-result" id="quiz-result"></div>
      <button id="quiz-play" type="button" hidden>再听一遍</button>
      <button id="quiz-next" type="button">下一题</button>
    </div>
  </section>

  <div class="bar">
    <input id="q" type="search" placeholder="搜 假名 / 中文 / 英文 / 罗马音" />
    <label class="rate">语速 <input id="rate" type="range" min="0.5" max="1.1" step="0.05" value="0.75" /> <span id="ratev">0.75</span></label>
    <button id="hide" type="button">藏意思</button>
    <button id="only-learned" type="button">只看学会</button>
  </div>
  <div id="list" class="list"></div>
  <p class="hint" id="count"></p>
  <div class="dock">
    <button id="prev" type="button">上一个</button>
    <button id="playone" type="button">读当前</button>
    <button id="auto" type="button">连续跟读</button>
    <button id="stop" type="button">停</button>
    <button id="next" type="button">下一个</button>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const LEARNED_KEY = "japanese-study-1-learned";
    let words = [];
    let shown = [];
    let cur = 0;
    let auto = false;
    let hide = false;
    let onlyLearned = false;
    let jaVoice = null;
    let learned = new Set();
    let quizMode = "text";
    let quizWord = null;
    let quizAnswered = false;
    let quizQueue = [];
    let quizPos = 0;

    function loadLearned() {
      try {
        learned = new Set(JSON.parse(localStorage.getItem(LEARNED_KEY) || "[]"));
      } catch {
        learned = new Set();
      }
    }

    function saveLearned() {
      localStorage.setItem(LEARNED_KEY, JSON.stringify([...learned]));
    }

    function wordKey(w) {
      return (w.kanji || "") + "|" + (w.kana || "") + "|" + (w.cat || "");
    }

    function isLearned(wOrKey) {
      const key = typeof wOrKey === "string" ? wOrKey : wordKey(wOrKey);
      return learned.has(key);
    }

    function learnedPool() {
      return words.filter((w) => isLearned(w));
    }

    function pickVoice() {
      const vs = speechSynthesis.getVoices();
      jaVoice =
        vs.find((v) => v.lang === "ja-JP" && /kyoko|siri|google|otoya|nanami|haruka/i.test(v.name)) ||
        vs.find((v) => v.lang.startsWith("ja")) ||
        null;
    }
    speechSynthesis.onvoiceschanged = pickVoice;
    pickVoice();
    loadLearned();

    function cleanSpeak(text) {
      return String(text || "").split(/[／\/]/)[0].trim();
    }

    function speak(text, then) {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(cleanSpeak(text));
      u.lang = "ja-JP";
      u.rate = parseFloat($("rate").value);
      if (jaVoice) u.voice = jaVoice;
      u.onend = () => { if (then) then(); };
      u.onerror = () => { if (then) then(); };
      speechSynthesis.speak(u);
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function uniqueCn(pool, exclude) {
      const seen = new Set([exclude]);
      const out = [];
      for (const w of shuffle(pool)) {
        const cn = w.cn.split(/[、，,/]/)[0].trim();
        if (!seen.has(cn)) {
          seen.add(cn);
          out.push(cn);
        }
        if (out.length >= 3) break;
      }
      return out;
    }

    function resetQuizQueue() {
      quizQueue = shuffle(learnedPool());
      quizPos = 0;
    }

    function invalidateQuizQueue() {
      quizQueue = [];
      quizPos = 0;
      quizWord = null;
      quizAnswered = false;
    }

    function updateQuizMeta() {
      const n = learnedPool().length;
      if (!n) {
        $("quiz-meta").textContent = "先点下面格子右上角 ✓ 标记学会，再开始";
      } else if (quizQueue.length) {
        const done = Math.min(quizPos, quizQueue.length);
        $("quiz-meta").textContent =
          "已学会 " + n + " 个 · 本轮 " + done + " / " + quizQueue.length + "（打乱顺序逐个测）";
      } else {
        $("quiz-meta").textContent = "已学会 " + n + " 个 · 打乱顺序逐个测完一轮";
      }
      $("quiz-next").disabled = n === 0;
      $("quiz-play").hidden = quizMode !== "audio" || !quizWord;
    }

    function renderQuizPrompt() {
      const prompt = $("quiz-prompt");
      if (!quizWord) {
        prompt.innerHTML = '<div class="quiz-meta">勾选词表后点「下一题」</div>';
        $("quiz-play").hidden = true;
        return;
      }
      if (quizMode === "text") {
        const big = quizWord.kanji || quizWord.kana;
        const sub = quizWord.kanji ? quizWord.kana : "";
        prompt.innerHTML =
          '<div class="quiz-kana">' + big + "</div>" +
          (sub ? '<div class="quiz-subkana">' + sub + "</div>" : "");
        $("quiz-play").hidden = true;
      } else {
        prompt.innerHTML =
          '<div class="quiz-audio"><span class="big">🔊</span><span class="quiz-meta">听读音，选中文意思</span></div>';
        $("quiz-play").hidden = false;
      }
    }

    function renderQuizOptions() {
      const box = $("quiz-options");
      box.innerHTML = "";
      if (!quizWord) return;
      const pool = learnedPool().length >= 4 ? learnedPool() : words;
      const correct = quizWord.cn.split(/[、，,/]/)[0].trim();
      const options = shuffle([correct, ...uniqueCn(pool, correct)]).slice(0, 4);
      options.forEach((cn) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = cn;
        btn.addEventListener("click", () => answerQuiz(cn, btn));
        box.appendChild(btn);
      });
    }

    function answerQuiz(choice, btn) {
      if (quizAnswered || !quizWord) return;
      quizAnswered = true;
      const correct = quizWord.cn.split(/[、，,/]/)[0].trim();
      const ok = choice === correct;
      [...$("quiz-options").children].forEach((el) => {
        const text = el.textContent;
        const isRight = text === correct;
        el.disabled = true;
        if (isRight) el.classList.add("correct");
        else if (el === btn) el.classList.add("wrong");
      });
      const label = (quizWord.kanji ? quizWord.kanji + " / " : "") + quizWord.kana;
      $("quiz-result").textContent = ok
        ? "✓ 对了：" + label + " = " + correct
        : "✗ 答案是「" + correct + "」（" + label + "）";
    }

    function nextQuiz() {
      const pool = learnedPool();
      if (!pool.length) {
        invalidateQuizQueue();
        renderQuizPrompt();
        $("quiz-options").innerHTML = "";
        $("quiz-result").textContent = "";
        updateQuizMeta();
        return;
      }
      if (!quizQueue.length || quizPos >= quizQueue.length) {
        const newRound = quizQueue.length && quizPos >= quizQueue.length;
        resetQuizQueue();
        if (newRound) $("quiz-result").textContent = "一轮完成，重新洗牌";
      }
      quizWord = quizQueue[quizPos++];
      quizAnswered = false;
      if (!($("quiz-result").textContent || "").includes("一轮完成")) {
        $("quiz-result").textContent = "";
      }
      renderQuizPrompt();
      renderQuizOptions();
      updateQuizMeta();
      if (quizMode === "audio") speak(quizWord.kana);
    }

    const CAT_ORDER = ["数字", "钱", "电话", "门牌", "日期", "星期", "月", "四季", "年", "时", "分", "秒", "计数", "计量", "日常", "其他"];

    function mark(i) {
      document.querySelectorAll(".cell").forEach((el) => el.classList.remove("playing"));
      const el = document.querySelector('.cell[data-i="' + i + '"]');
      if (el) {
        el.classList.add("playing");
        el.scrollIntoView({ block: "center", behavior: "smooth" });
      }
    }

    function playIndex(i, chain) {
      if (i < 0 || i >= shown.length) { auto = false; $("auto").classList.remove("on"); return; }
      cur = i;
      mark(i);
      speak(shown[i].kana, () => {
        if (!auto) return;
        setTimeout(() => playIndex(i + 1, true), 650);
      });
    }

    function shortCn(cn) {
      return String(cn || "").replace(/（.*?）/g, "").trim();
    }

    function render() {
      const q = $("q").value.trim().toLowerCase();
      shown = words.filter((w) => {
        if (onlyLearned && !isLearned(w)) return false;
        if (!q) return true;
        return [w.kanji, w.kana, w.roma, w.cn, w.en, w.phonetic, w.cat].join(" ").toLowerCase().includes(q);
      });
      const learnedCount = learnedPool().length;
      $("count").textContent = shown.length + " / " + words.length + " · 已学会 " + learnedCount + " · 点格子朗读，点右上角勾选学会";

      const groups = new Map();
      shown.forEach((w, i) => {
        const cat = w.cat || "其他";
        if (!groups.has(cat)) groups.set(cat, []);
        groups.get(cat).push({ w, i });
      });
      const cats = CAT_ORDER.filter((c) => groups.has(c)).concat(
        [...groups.keys()].filter((c) => !CAT_ORDER.includes(c))
      );
      $("list").innerHTML = cats.map((cat) => {
        const items = groups.get(cat);
        return `<section class="cat cat-${cat}">
          <div class="cat-h">${cat}<small>${items.length}</small></div>
          <div class="grid">${items.map(({ w, i }) => `
            <div class="cell${isLearned(w) ? " learned" : ""}" data-i="${i}" data-key="${wordKey(w)}" title="${w.cn} · ${w.en}">
              <button class="mark" type="button" data-learn="${wordKey(w)}" aria-label="学会了">✓</button>
              <div class="kanji">${w.kanji || w.kana}</div>
              <div class="kana">${w.kanji ? w.kana : ""}</div>
              <div class="mean"${hide ? ' style="visibility:hidden"' : ""}>${shortCn(w.cn)}</div>
              <div class="roma">${w.roma}</div>
            </div>`).join("")}</div>
        </section>`;
      }).join("") || '<p class="empty">没有匹配</p>';
      updateQuizMeta();
    }

    $("mode-text").onclick = () => {
      quizMode = "text";
      $("mode-text").classList.add("on");
      $("mode-audio").classList.remove("on");
      quizAnswered = false;
      renderQuizPrompt();
      renderQuizOptions();
      updateQuizMeta();
    };
    $("mode-audio").onclick = () => {
      quizMode = "audio";
      $("mode-audio").classList.add("on");
      $("mode-text").classList.remove("on");
      quizAnswered = false;
      renderQuizPrompt();
      renderQuizOptions();
      updateQuizMeta();
      if (quizWord) speak(quizWord.kana);
    };
    $("quiz-next").onclick = nextQuiz;
    $("quiz-play").onclick = () => { if (quizWord) speak(quizWord.kana); };

    $("q").addEventListener("input", render);
    $("rate").addEventListener("input", () => { $("ratev").textContent = $("rate").value; });
    $("hide").addEventListener("click", () => {
      hide = !hide;
      $("hide").classList.toggle("on", hide);
      $("hide").textContent = hide ? "显示意思" : "藏意思";
      render();
    });
    $("only-learned").addEventListener("click", () => {
      onlyLearned = !onlyLearned;
      $("only-learned").classList.toggle("on", onlyLearned);
      $("only-learned").textContent = onlyLearned ? "显示全部" : "只看学会";
      render();
    });
    $("list").addEventListener("click", (e) => {
      const learnBtn = e.target.closest("[data-learn]");
      if (learnBtn) {
        e.preventDefault();
        e.stopPropagation();
        const kana = learnBtn.dataset.learn;
        if (learned.has(kana)) learned.delete(kana);
        else learned.add(kana);
        saveLearned();
        invalidateQuizQueue();
        render();
        return;
      }
      const cell = e.target.closest(".cell");
      if (!cell) return;
      const i = +cell.dataset.i;
      if (i < 0) return;
      auto = false;
      $("auto").classList.remove("on");
      playIndex(i);
    });
    $("playone").onclick = () => { auto = false; $("auto").classList.remove("on"); playIndex(cur); };
    $("prev").onclick = () => { auto = false; playIndex(Math.max(0, cur - 1)); };
    $("next").onclick = () => { auto = false; playIndex(Math.min(shown.length - 1, cur + 1)); };
    $("auto").onclick = () => {
      auto = !auto;
      $("auto").classList.toggle("on", auto);
      if (auto) playIndex(cur);
      else speechSynthesis.cancel();
    };
    $("stop").onclick = () => { auto = false; $("auto").classList.remove("on"); speechSynthesis.cancel(); };

    fetch("words.json")
      .then((r) => r.json())
      .then((data) => { words = data; render(); updateQuizMeta(); })
      .catch(() => { $("list").innerHTML = '<p class="empty">词表加载失败</p>'; });
  </script>
</body>
</html>
