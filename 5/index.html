<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>5　自己紹介</title>
  <style>
    :root {
      --bg:#090909; --card:#161616; --on:#1c2a20;
      --line:#2a2a2a; --text:#ececec; --dim:#8a8a8a;
      --accent:#7dcea0; --hr:#8ab4f8;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:"Hiragino Sans","PingFang SC","Noto Sans JP",sans-serif;
      background:var(--bg); color:var(--text);
      padding:12px 12px calc(96px + env(safe-area-inset-bottom));
      line-height:1.6;
    }
    a { color:#ececec; text-decoration:none; }
    .nums { display:flex; gap:10px; flex-wrap:wrap; font-weight:700; font-size:13px; margin-bottom:10px; }
    .nums a.on { color:var(--accent); }
    h1 { font-size:20px; margin:4px 0; }
    .sub { color:var(--dim); font-size:13px; margin-bottom:12px; }
    .tool {
      display:flex; flex-wrap:wrap; gap:8px; align-items:center;
      margin-bottom:14px;
    }
    button {
      background:var(--card); color:var(--text); border:1px solid var(--line);
      border-radius:8px; padding:8px 12px; cursor:pointer; font-size:13px;
    }
    button:hover, button.on { border-color:var(--accent); color:var(--accent); }
    .rate { color:var(--dim); font-size:12px; display:flex; align-items:center; gap:6px; }
    input[type=range] { width:90px; accent-color:var(--accent); }
    .full {
      background:var(--card); border:1px solid var(--line); border-radius:12px;
      padding:12px; margin-bottom:14px;
    }
    .full audio { width:100%; margin-top:8px; }
    .line {
      background:var(--card); border:1px solid var(--line); border-radius:12px;
      padding:12px; margin-bottom:10px;
    }
    .line.playing { border-color:var(--accent); background:var(--on); }
    .ja { font-size:16.5px; font-weight:650; }
    .kana { color:#c5d4e8; font-size:13.5px; margin-top:6px; }
    .zh { color:#b8b8b8; font-size:13px; margin-top:6px; }
    .hide .kana, .hide .zh { visibility:hidden; }
    .btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
    .dock {
      position:fixed; left:0; right:0; bottom:0; background:#111;
      border-top:1px solid var(--line);
      padding:10px 12px calc(10px + env(safe-area-inset-bottom));
      display:flex; gap:8px; justify-content:center; flex-wrap:wrap;
    }
    .hint { color:var(--dim); font-size:12px; margin-top:8px; }
  </style>
</head>
<body>
  <div class="nums">
    <a href="../0/">0 速查</a>
    <a href="../1/">1 数字</a>
    <a href="../2/">2 片假名</a>
    <a href="../3/">3 真题</a>
    <a href="../4/">4 面试</a>
    <a href="../5/" class="on">5 自介</a>
    <a href="../" style="opacity:.7;font-weight:500">首页</a>
  </div>
  <h1>5　自己紹介（跟读）</h1>
  <p class="sub">按最新経歴。可听整段录音，也可逐句跟读。点「读这句」用系统日语发音。</p>

  <div class="tool">
    <button type="button" id="hide">藏假名/中文</button>
    <label class="rate">语速 <input id="rate" type="range" min="0.5" max="1.05" step="0.05" value="0.72"> <span id="ratev">0.72</span></label>
  </div>

  <section class="full">
    <strong>整段录音（Kyoko）</strong>
    <audio id="full" controls preload="metadata" src="intro.m4a"></audio>
    <p class="hint">先听整段，再逐句跟。语速滑条只影响「读这句」系统发音。</p>
  </section>

  <div id="list"></div>

  <div class="dock">
    <button type="button" id="prev">上一句</button>
    <button type="button" id="play">读当前</button>
    <button type="button" id="auto">连续跟读</button>
    <button type="button" id="stop">停</button>
    <button type="button" id="next">下一句</button>
  </div>

  <script>
    const LINES = [
      {
        ja: "本日はお忙しいところ、面接の機会をいただき、ありがとうございます。",
        kana: "ほんじつは おいそがしいところ、めんせつの きかいを いただき、ありがとうございます。",
        zh: "今天百忙之中给我面试机会，非常感谢。"
      },
      {
        ja: "シュユエンジンと申します。中国の湖北省出身で、現在は東京の池袋付近に住んでおります。",
        kana: "シュユエンジンと もうします。ちゅうごくの こほくしょう しゅっしんで、げんざいは とうきょうの いけぶくろ ふきんに すんで おります。",
        zh: "我叫 XUYUANJING。中国湖北省出身，现住在东京池袋附近。"
      },
      {
        ja: "在留資格は技術・人文知識・国際業務です。日本語能力試験のN1に合格しています。",
        kana: "ざいりゅうしかくは ぎじゅつ・じんぶんちしき・こくさいぎょうむです。にほんごのうりょくしけんの エヌいち に ごうかくしています。",
        zh: "在留资格是技人国。已通过 JLPT N1。"
      },
      {
        ja: "二千十四年よりソフトウェア開発に携わり、主にサーバーサイドを担当してきました。",
        kana: "にせんじゅうよねん より ソフトウェア かいはつに たずさわり、おもに サーバーサイドを たんとうして きました。",
        zh: "从 2014 年起做软件开发，主要负责服务端。"
      },
      {
        ja: "得意な言語はGoとCプラスプラスです。高負荷のネットワークや、HTTP、TCP、WebSocket、MySQL、Redis、Kafkaなどの経験があります。",
        kana: "とくいな げんごは ゴー と シープラスプラスです。こうふかの ネットワークや、エイチティーティーピー、ティーシーピー、ウェブソケット、マイエスキューエル、レディス、カフカ などの けいけんが あります。",
        zh: "擅长 Go 和 C++。有高负载网络，以及 HTTP / TCP / WebSocket / MySQL / Redis / Kafka 等经验。"
      },
      {
        ja: "直近では、東京の株式会社ビーアイテックで、現物取引システムのバックエンドを担当しています。",
        kana: "ちょっきんでは、とうきょうの かぶしきがいしゃ ビーアイテックで、げんぶつとりひき システムの バックエンドを たんとうして います。",
        zh: "最近在东京的株式会社 BI Tech，负责现货交易系统后端。"
      },
      {
        ja: "その前は、中国の微創で、ピコ向けのVRマルチプレイのサーバーを担当し、それ以前は中央企業向けの三次元プロジェクト管理システムのバックエンドも開発していました。",
        kana: "そのまえは、ちゅうごくの びそうで、ピコむけの ブイアール マルチプレイの サーバーを たんとうし、それいぜんは ちゅうおうきぎょうむけの さんじげん プロジェクトかんり システムの バックエンドも かいはつして いました。",
        zh: "此前在中国微创负责面向 PICO 的 VR 联机服务器；再往前做过面向央企的三维项目管理系统后端。"
      },
      {
        ja: "また、創業会社では技術パートナーとして、ゼロからクライアントとサーバーを納品した経験もあります。",
        kana: "また、そうぎょうがいしゃでは ぎじゅつパートナーとして、ゼロから クライアントと サーバーを のうひんした けいけんも あります。",
        zh: "另外在创业公司作为技术合伙人，有从零交付客户端和服务器的经验。"
      },
      {
        ja: "サーバー開発の仕事に貢献したいと考えております。どうぞよろしくお願いいたします。",
        kana: "サーバーかいはつの しごとに こうけんしたいと かんがえて おります。どうぞ よろしく おねがいいたします。",
        zh: "希望能为服务器开发工作贡献力量。请多关照。"
      }
    ];

    const $ = (id) => document.getElementById(id);
    let cur = 0;
    let auto = false;
    let hide = false;
    let jaVoice = null;

    function pickVoice() {
      const vs = speechSynthesis.getVoices();
      jaVoice =
        vs.find((v) => v.lang === "ja-JP" && /kyoko|siri|google|otoya|nanami|haruka/i.test(v.name)) ||
        vs.find((v) => v.lang.startsWith("ja")) ||
        null;
    }
    speechSynthesis.onvoiceschanged = pickVoice;
    pickVoice();

    function speak(text, then) {
      speechSynthesis.cancel();
      $("full").pause();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "ja-JP";
      u.rate = parseFloat($("rate").value);
      if (jaVoice) u.voice = jaVoice;
      u.onend = () => { if (then) then(); };
      u.onerror = () => { if (then) then(); };
      speechSynthesis.speak(u);
    }

    function mark(i) {
      document.querySelectorAll(".line").forEach((el) => el.classList.remove("playing"));
      const el = document.querySelector('.line[data-i="' + i + '"]');
      if (el) {
        el.classList.add("playing");
        el.scrollIntoView({ block: "center", behavior: "smooth" });
      }
    }

    function playIndex(i) {
      if (i < 0 || i >= LINES.length) {
        auto = false;
        $("auto").classList.remove("on");
        return;
      }
      cur = i;
      mark(i);
      speak(LINES[i].ja, () => {
        if (!auto) return;
        setTimeout(() => playIndex(i + 1), 700);
      });
    }

    function render() {
      $("list").innerHTML = LINES.map((w, i) => `
        <section class="line${hide ? " hide" : ""}" data-i="${i}">
          <div class="ja">${w.ja}</div>
          <div class="kana">${w.kana}</div>
          <div class="zh">${w.zh}</div>
          <div class="btns">
            <button type="button" data-speak="${i}">读这句</button>
          </div>
        </section>
      `).join("");
    }

    $("hide").onclick = () => {
      hide = !hide;
      $("hide").classList.toggle("on", hide);
      $("hide").textContent = hide ? "显示假名/中文" : "藏假名/中文";
      render();
      mark(cur);
    };
    $("rate").oninput = () => { $("ratev").textContent = $("rate").value; };
    $("list").onclick = (e) => {
      const btn = e.target.closest("[data-speak]");
      const line = e.target.closest(".line");
      const i = btn ? +btn.dataset.speak : (line ? +line.dataset.i : -1);
      if (i < 0) return;
      auto = false;
      $("auto").classList.remove("on");
      playIndex(i);
    };
    $("prev").onclick = () => { auto = false; $("auto").classList.remove("on"); playIndex(Math.max(0, cur - 1)); };
    $("next").onclick = () => { auto = false; $("auto").classList.remove("on"); playIndex(Math.min(LINES.length - 1, cur + 1)); };
    $("play").onclick = () => { auto = false; $("auto").classList.remove("on"); playIndex(cur); };
    $("auto").onclick = () => {
      auto = !auto;
      $("auto").classList.toggle("on", auto);
      if (auto) playIndex(cur);
      else speechSynthesis.cancel();
    };
    $("stop").onclick = () => {
      auto = false;
      $("auto").classList.remove("on");
      speechSynthesis.cancel();
      $("full").pause();
    };
    $("full").addEventListener("play", () => speechSynthesis.cancel());

    render();
  </script>
</body>
</html>
