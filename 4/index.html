<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>4　面接</title>
  <style>
    :root {
      --bg:#090909; --card:#161616; --on:#1c2a20; --qbg:#121826;
      --line:#2a2a2a; --text:#ececec; --dim:#8a8a8a;
      --accent:#7dcea0; --hr:#8ab4f8;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:"Hiragino Sans","PingFang SC","Noto Sans JP",sans-serif;
      background:var(--bg); color:var(--text);
      padding:12px 12px calc(92px + env(safe-area-inset-bottom));
      line-height:1.55;
    }
    a { color:#ececec; text-decoration:none; }
    .nums { display:flex; gap:10px; flex-wrap:wrap; font-weight:700; font-size:13px; margin-bottom:10px; }
    .nums a.on { color:var(--accent); }
    h1 { font-size:20px; margin:4px 0; }
    .sub { color:var(--dim); font-size:13px; margin-bottom:10px; }
    .tabs { display:flex; gap:8px; margin:10px 0; }
    .tabs button, .tool button, .qa-btn {
      background:var(--card); color:var(--text); border:1px solid var(--line);
      border-radius:8px; padding:8px 12px; cursor:pointer; font-size:13px;
    }
    .tabs button.on, .tool button.on { border-color:var(--accent); color:var(--accent); }
    .tool { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
    .rate { color:var(--dim); font-size:12px; display:flex; align-items:center; gap:6px; }
    input[type=range] { width:88px; accent-color:var(--accent); }
    input[type=search] {
      flex:1; min-width:140px; background:var(--card); color:var(--text);
      border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:15px;
    }
    .pair {
      border:1px solid var(--line); border-radius:12px; margin-bottom:14px; overflow:hidden;
    }
    .pair.playing { border-color:var(--accent); }
    .qbox { background:var(--qbg); padding:12px; }
    .abox { background:var(--card); padding:12px; }
    .role { font-size:11px; font-weight:700; margin-bottom:6px; }
    .role.hr { color:var(--hr); }
    .role.me { color:var(--accent); }
    .ja { font-size:16.5px; }
    .kana { color:#c5d4e8; font-size:13px; margin-top:3px; }
    .roma { color:var(--accent); font-size:12px; margin-top:2px; font-family:ui-monospace,Menlo,monospace; }
    .zh { color:#b8b8b8; font-size:13px; margin-top:3px; }
    .hidden-txt .ja, .hidden-txt .kana, .hidden-txt .roma, .hidden-txt .zh { filter:blur(7px); user-select:none; }
    .btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
    .qa-btn.listen { border-color:var(--hr); color:var(--hr); font-weight:700; }
    .n { color:var(--dim); font-size:12px; float:right; }
    .vrow {
      display:grid; grid-template-columns:44px 1fr; gap:8px; align-items:center;
      background:var(--card); border:1px solid var(--line); border-radius:10px;
      padding:8px 10px; margin-bottom:6px;
    }
    .vrow.playing { border-color:var(--accent); background:var(--on); }
    .play {
      width:42px; height:42px; border-radius:50%; border:1px solid var(--line);
      background:#111; color:var(--text); cursor:pointer;
    }
    .wj { font-size:17px; }
    .dock {
      position:fixed; left:0; right:0; bottom:0; background:#111;
      border-top:1px solid var(--line);
      padding:10px 12px calc(10px + env(safe-area-inset-bottom));
      display:flex; gap:8px; justify-content:center; flex-wrap:wrap;
    }
    .hint { color:var(--dim); font-size:12px; margin:6px 0 10px; }
    h2 { font-size:14px; color:var(--accent); margin:16px 0 8px; }
  </style>
</head>
<body>
  <div class="nums">
    <a href="../1/">1 开口</a>
    <a href="../2/">2 片假名</a>
    <a href="../3/">3 真题</a>
    <a href="../4/" class="on">4 面试</a>
    <a href="../" style="opacity:.7;font-weight:500">首页</a>
  </div>
  <h1>4　面试对话</h1>
  <p class="sub">先听面试官（练耳朵），再跟读你的回答。回答按公开简历写。单词在第二个标签。</p>
  <div class="tabs">
    <button type="button" id="tab-qa" class="on">对话</button>
    <button type="button" id="tab-w">单词</button>
  </div>
  <div class="tool">
    <button type="button" id="ear" class="on">练耳朵：问题先藏字</button>
    <label class="rate">语速 <input id="rate" type="range" min="0.5" max="1" step="0.05" value="0.68"> <span id="ratev">0.68</span></label>
  </div>
  <p class="hint" id="hint">点「听问题」只出声。听懂再点「显示文字」。然后听/跟读回答。</p>
  <div id="qa"></div>
  <div id="words" style="display:none"></div>
  <div class="dock">
    <button type="button" class="qa-btn" id="nextq">下一题（先放问题）</button>
    <button type="button" class="qa-btn" id="auto">连续：问→答→下一题</button>
    <button type="button" class="qa-btn" id="stop">停</button>
  </div>
<script src="data.js"></script>
<script>
let jaVoice=null, auto=false, ear=true, idx=0, tab="qa";
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  jaVoice=vs.find(v=>v.lang.startsWith("ja")&&/kyoko|google|otoya|nanami|haruka|siri/i.test(v.name))
    || vs.find(v=>v.lang.startsWith("ja")) || null;
}
speechSynthesis.onvoiceschanged=pickVoice; pickVoice();
function rate(){ return parseFloat(document.getElementById("rate").value); }
function speak(text, then){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="ja-JP"; u.rate=rate(); if(jaVoice) u.voice=jaVoice;
  u.onend=()=>then&&then(); u.onerror=()=>then&&then();
  speechSynthesis.speak(u);
}
function mark(sel){
  document.querySelectorAll(".pair,.vrow").forEach(el=>el.classList.remove("playing"));
  const el=document.querySelector(sel); if(el){ el.classList.add("playing"); el.scrollIntoView({block:"center",behavior:"smooth"}); }
}
function renderQA(){
  document.getElementById("qa").innerHTML = PAIRS.map((p,i)=>`
    <div class="pair" id="p${i}">
      <div class="qbox">
        <div class="role hr">面试官 <span class="n">${i+1}/${PAIRS.length}</span></div>
        <div class="qtxt ${ear?"hidden-txt":""}" data-i="${i}">
          <div class="ja">${p.q.ja}</div>
          <div class="kana">${p.q.kana}</div>
          <div class="roma">${p.q.roma}</div>
          <div class="zh">${p.q.zh}</div>
        </div>
        <div class="btns">
          <button type="button" class="qa-btn listen" data-q="${i}">听问题</button>
          <button type="button" class="qa-btn" data-show="${i}">显示文字</button>
        </div>
      </div>
      <div class="abox">
        <div class="role me">你（按简历）</div>
        <div class="ja">${p.a.ja}</div>
        <div class="kana">${p.a.kana}</div>
        <div class="roma">${p.a.roma}</div>
        <div class="zh">${p.a.zh}</div>
        <div class="btns">
          <button type="button" class="qa-btn" data-a="${i}">听回答 / 跟读</button>
        </div>
      </div>
    </div>`).join("");
}
function renderWords(){
  const q=(document.getElementById("wq")?.value||"").trim().toLowerCase();
  const list=WORDS.filter(w => !q || [w.ja,w.kana,w.roma,w.zh].join(" ").toLowerCase().includes(q));
  document.getElementById("words").innerHTML = `
    <input id="wq" type="search" placeholder="搜 日语 / 假名 / 罗马音 / 中文" value="${q.replace(/"/g,"&quot;")}">
    <p class="hint">${list.length} / ${WORDS.length}　点喇叭听读音</p>
    ${list.map(w=>`
      <div class="vrow" data-speak="${w.ja}">
        <button class="play" type="button">▶</button>
        <div>
          <div class="wj">${w.ja}</div>
          <div class="kana">${w.kana}</div>
          <div class="roma">${w.roma}</div>
          <div class="zh">${w.zh}</div>
        </div>
      </div>`).join("")}`;
  document.getElementById("wq").oninput=()=>renderWords();
}
function playQ(i, then){
  idx=i; mark("#p"+i);
  speak(PAIRS[i].q.ja, then);
}
function playA(i, then){
  idx=i; mark("#p"+i);
  speak(PAIRS[i].a.ja, then);
}
function nextAuto(){
  if(!auto) return;
  if(idx>=PAIRS.length){ auto=false; return; }
  playQ(idx, ()=> setTimeout(()=> playA(idx, ()=> { idx++; setTimeout(nextAuto, 500); }), 700));
}

document.getElementById("rate").oninput=e=>document.getElementById("ratev").textContent=e.target.value;
document.getElementById("ear").onclick=()=>{
  ear=!ear; document.getElementById("ear").classList.toggle("on",ear);
  document.querySelectorAll(".qtxt").forEach(el=>el.classList.toggle("hidden-txt", ear&&!el.classList.contains("shown")));
};
document.getElementById("tab-qa").onclick=()=>{ tab="qa"; document.getElementById("tab-qa").classList.add("on"); document.getElementById("tab-w").classList.remove("on"); document.getElementById("qa").style.display=""; document.getElementById("words").style.display="none"; document.getElementById("hint").style.display=""; };
document.getElementById("tab-w").onclick=()=>{ tab="w"; document.getElementById("tab-w").classList.add("on"); document.getElementById("tab-qa").classList.remove("on"); document.getElementById("qa").style.display="none"; document.getElementById("words").style.display=""; document.getElementById("hint").style.display="none"; renderWords(); };
document.getElementById("qa").addEventListener("click",e=>{
  const q=e.target.closest("[data-q]"); const a=e.target.closest("[data-a]"); const s=e.target.closest("[data-show]");
  if(q){ auto=false; playQ(+q.dataset.q); }
  if(a){ auto=false; playA(+a.dataset.a); }
  if(s){ const box=document.querySelector('.qtxt[data-i="'+s.dataset.show+'"]'); box.classList.remove("hidden-txt"); box.classList.add("shown"); }
});
document.getElementById("words").addEventListener("click",e=>{
  const row=e.target.closest(".vrow"); if(!row) return;
  auto=false; mark(".vrow[data-speak='"+row.dataset.speak+"']"); speak(row.dataset.speak);
});
document.getElementById("nextq").onclick=()=>{
  auto=false; speechSynthesis.cancel();
  playQ(idx);
  idx=Math.min(idx+1, PAIRS.length-1);
};
document.getElementById("auto").onclick=()=>{
  auto=!auto; document.getElementById("auto").classList.toggle("on",auto);
  if(auto) nextAuto(); else speechSynthesis.cancel();
};
document.getElementById("stop").onclick=()=>{ auto=false; document.getElementById("auto").classList.remove("on"); speechSynthesis.cancel(); };

renderQA();
</script>
</body>
</html>
