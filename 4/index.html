  <title>4　面接</title>
  <style>
    :root {
      --bg: #090909; --card: #161616; --on: #1f2a22; --line: #2a2a2a;
      --text: #ececec; --dim: #8a8a8a; --accent: #7dcea0; --hr: #8ab4f8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Hiragino Sans", "PingFang SC", "Noto Sans JP", sans-serif;
      background: var(--bg); color: var(--text);
      padding: 12px 12px calc(80px + env(safe-area-inset-bottom));
      line-height: 1.55;
    }
    a { color: #ececec; text-decoration: none; }
    .nums { display: flex; gap: 10px; flex-wrap: wrap; font-weight: 700; font-size: 13px; margin-bottom: 10px; }
    .nums a.on { color: var(--accent); }
    h1 { font-size: 20px; margin: 6px 0 4px; }
    .sub { color: var(--dim); font-size: 12.5px; margin-bottom: 12px; }
    .toc { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .toc a {
      background: var(--card); border: 1px solid var(--line); border-radius: 999px;
      padding: 5px 10px; font-size: 12px; color: #ddd;
    }
    h2 {
      font-size: 14px; color: var(--accent); margin: 18px 0 8px;
      border-left: 3px solid var(--accent); padding-left: 8px;
    }
    .line {
      background: var(--card); border: 1px solid var(--line); border-radius: 10px;
      padding: 10px 10px; margin-bottom: 8px;
      display: grid; grid-template-columns: 42px 1fr; gap: 8px; align-items: start;
    }
    .line.playing { border-color: var(--accent); background: var(--on); }
    .who { font-size: 11px; font-weight: 700; margin-bottom: 2px; }
    .who.hr { color: var(--hr); }
    .who.me { color: var(--accent); }
    .ja { font-size: 16px; letter-spacing: .02em; }
    .roma { color: var(--accent); font-size: 12px; margin-top: 3px; font-family: ui-monospace, Menlo, monospace; }
    .zh { color: #b8b8b8; font-size: 13px; margin-top: 2px; }
    .play {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--card); color: var(--text);
      border: 1px solid var(--line); cursor: pointer; font-size: 14px;
    }
    button.play:hover, .play.on { border-color: var(--accent); color: var(--accent); }
    .vrow {
      display: grid; grid-template-columns: 42px 1fr; gap: 8px;
      background: var(--card); border: 1px solid var(--line); border-radius: 10px;
      padding: 8px 10px; margin-bottom: 6px; align-items: center;
    }
    .vja { font-size: 15px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 12px; }
    .actions button {
      background: var(--card); color: var(--text); border: 1px solid var(--line);
      border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 13px;
    }
    .actions button.on { border-color: var(--accent); color: var(--accent); }
    .dock {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: #111; border-top: 1px solid var(--line);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
    }
    .rate { color: var(--dim); font-size: 12px; display: flex; align-items: center; gap: 6px; margin: 8px 0; }
    input[type="range"] { width: 90px; accent-color: var(--accent); }
    .hint { color: var(--dim); font-size: 12px; }
  </style>
</head>

let jaVoice = null, auto = false, curSec = "intro";
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  jaVoice = vs.find(v => v.lang.startsWith("ja") && /kyoko|google|otoya|nanami|haruka|siri/i.test(v.name))
    || vs.find(v => v.lang.startsWith("ja")) || null;
}
speechSynthesis.onvoiceschanged = pickVoice;
pickVoice();

function speak(text, then) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP";
  u.rate = parseFloat(document.getElementById("rate").value);
  if (jaVoice) u.voice = jaVoice;
  u.onend = () => then && then();
  u.onerror = () => then && then();
  speechSynthesis.speak(u);
}

  document.getElementById("app").innerHTML = SECTIONS.map(s => {
    if (s.kind === "vocab") {
      return `<h2 id="${s.id}">${s.title}</h2>` + s.items.map((it, i) => `
        <div class="vrow" data-speak="${it[0]}">
          <button class="play" type="button">▶</button>
          <div>
            <div class="vja">${it[0]}　<span class="roma">${it[1]} · ${it[2]}</span></div>
            <div class="zh">${it[3]}</div>
          </div>
        </div>`).join("");
    }
    return `<h2 id="${s.id}">${s.title}</h2>
      <div class="actions"><button type="button" class="secplay" data-sec="${s.id}">连续读这一段</button></div>` +
      s.lines.map((ln, i) => `
        <div class="line" data-sec="${s.id}" data-i="${i}" data-ja="${ln[1].replace(/"/g,'&quot;')}">
          <button class="play" type="button">▶</button>
          <div>
            <div class="who ${ln[0]}">${ln[0]==="hr" ? "面接官" : "你"}</div>
            <div class="ja">${ln[1]}</div>
            <div class="roma">${ln[2]}</div>
            <div class="zh">${ln[3]}</div>
          </div>
        </div>`).join("");
  }).join("");
}

document.getElementById("rate").oninput = e => document.getElementById("ratev").textContent = e.target.value;
document.getElementById("stop").onclick = () => { auto = false; speechSynthesis.cancel(); };

function playChain(nodes, i) {
  document.querySelectorAll(".line,.vrow").forEach(el => el.classList.remove("playing"));
  if (!auto || i >= nodes.length) { auto = false; return; }
  const el = nodes[i];
  el.classList.add("playing");
  el.scrollIntoView({ block: "center", behavior: "smooth" });
  const ja = el.dataset.ja || el.dataset.speak;
  speak(ja, () => setTimeout(() => playChain(nodes, i + 1), 420));
}

document.getElementById("app").addEventListener("click", (e) => {
  const secBtn = e.target.closest(".secplay");
  if (secBtn) {
    curSec = secBtn.dataset.sec;
    auto = true;
    const nodes = [...document.querySelectorAll('.line[data-sec="'+curSec+'"]')];
    playChain(nodes, 0);
    return;
  }
  const row = e.target.closest(".line, .vrow");
  if (!row) return;
  auto = false;
  document.querySelectorAll(".line,.vrow").forEach(el => el.classList.remove("playing"));
  row.classList.add("playing");
  speak(row.dataset.ja || row.dataset.speak);
});

document.getElementById("playsec").onclick = () => {
  const h = location.hash.replace("#","") || "intro";
  curSec = document.getElementById(h) ? h : "intro";
  auto = true;
  const nodes = [...document.querySelectorAll('.line[data-sec="'+curSec+'"]')];
  if (nodes.length) playChain(nodes, 0);
  else {
    const v = [...document.querySelectorAll(".vrow")];
    playChain(v, 0);
  }
};

render();
</script>
</body>
</html>
